root: true

env:
  browser: true
  es2021: true

extends:
  - eslint:recommended
  - plugin:react/recommended

parserOptions:
  ecmaVersion: latest
  sourceType: module
  ecmaFeatures:
    jsx: true

settings:
  react:
    version: detect

rules:
  no-unused-vars:
    - error
    - argsIgnorePattern: '^_'
      varsIgnorePattern: '^_'
  react/react-in-jsx-scope: off
  react/prop-types: off
