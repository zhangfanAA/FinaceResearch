[project]
name = "micro-quant-pipeline-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "yfinance>=0.2",
  "langgraph>=0.2",
  "requests>=2.32",
  "chromadb>=0.5",
  "httpx>=0.27",
  "openai>=1.30",
  "akshare>=1.14.0",
  "pandas>=2.0.0",
  "pandas_ta>=0.3.14b",
  "tenacity>=8.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
